services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bruiser
      POSTGRES_PASSWORD: bruiser
      POSTGRES_DB: bruiser
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruiser"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - bruiser-pg:/var/lib/postgresql/data

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      BRUISER_DATABASE_URL: postgres://bruiser:bruiser@postgres:5432/bruiser?sslmode=disable
      BRUISER_HTTP_ADDR: ":8080"
      BRUISER_DEV_HMAC_SECRET: dev-secret-change-me
      BRUISER_MERCHANT_ID: arsenal
      BRUISER_MERCHANT_NAME: Arsenal FC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve"]

volumes:
  bruiser-pg:
