services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bruiser
      POSTGRES_PASSWORD: bruiser
      POSTGRES_DB: bruiser
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruiser"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - bruiser-pg:/var/lib/postgresql/data

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gateway
    environment:
      BRUISER_DATABASE_URL: postgres://bruiser:bruiser@postgres:5432/bruiser?sslmode=disable
      BRUISER_HTTP_ADDR: ":8080"
      BRUISER_DEV_HMAC_SECRET: dev-secret-change-me
      BRUISER_MERCHANT_ID: arsenal
      BRUISER_MERCHANT_NAME: Arsenal FC
      BRUISER_PROFILE: /configs/arsenal.yaml
      BRUISER_EDGE_SECRET: edge-secret-dev
      BRUISER_ORIGIN_SECRET: origin-lock-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve"]

  simtix:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: simtix
    environment:
      SIMTIX_HTTP_ADDR: ":8090"
      SIMTIX_EDGE_ADDR: ":8091"
      SIMTIX_ORIGIN_URL: "http://127.0.0.1:8090"
      SIMTIX_BRUISER_URL: "http://gateway:8080"
      SIMTIX_ORIGIN_SECRET: origin-lock-dev
      BRUISER_EDGE_SECRET: edge-secret-dev
      BRUISER_DEV_HMAC_SECRET: dev-secret-change-me
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      - gateway

volumes:
  bruiser-pg:
