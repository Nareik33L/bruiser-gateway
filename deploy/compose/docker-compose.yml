# Lab stack. Secrets come from the environment (`make demo-up` exports LAB_ENV)
# or a local .env — never from committed well-known values.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bruiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bruiser}
      POSTGRES_DB: bruiser
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruiser"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - bruiser-pg:/var/lib/postgresql/data

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gateway
    environment:
      BRUISER_ENV: lab
      BRUISER_DATABASE_URL: postgres://bruiser:${POSTGRES_PASSWORD:-bruiser}@postgres:5432/bruiser?sslmode=disable
      BRUISER_HTTP_ADDR: ":8080"
      BRUISER_ADMIN_ADDR: ":8082"
      BRUISER_MERCHANT_ID: arsenal
      BRUISER_MERCHANT_NAME: Arsenal FC
      BRUISER_PROFILE: /configs/arsenal.yaml
      BRUISER_PROXY_ADDR: ":8081"
      BRUISER_ORIGIN_URL: http://simtix:8090
      BRUISER_CHECK_EDGE_URL: http://simtix:8091
      BRUISER_CHECK_ORIGIN_URL: http://simtix:8090
      BRUISER_MODE: enforce
      BRUISER_DEV_HMAC_SECRET: ${BRUISER_DEV_HMAC_SECRET:-change-me}
      BRUISER_EDGE_SECRET: ${BRUISER_EDGE_SECRET:-change-me}
      BRUISER_ORIGIN_SECRET: ${BRUISER_ORIGIN_SECRET:-change-me}
      BRUISER_ADMIN_SECRET: ${BRUISER_ADMIN_SECRET:-change-me}
      BRUISER_OPERATOR_SECRET: ${BRUISER_OPERATOR_SECRET:-change-me}
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve"]

  simtix:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: simtix
    environment:
      SIMTIX_HTTP_ADDR: ":8090"
      SIMTIX_EDGE_ADDR: ":8091"
      SIMTIX_ORIGIN_URL: "http://127.0.0.1:8090"
      SIMTIX_BRUISER_URL: "http://gateway:8080"
      SIMTIX_ORIGIN_SECRET: ${BRUISER_ORIGIN_SECRET:-change-me}
      BRUISER_EDGE_SECRET: ${BRUISER_EDGE_SECRET:-change-me}
      BRUISER_ORIGIN_SECRET: ${BRUISER_ORIGIN_SECRET:-change-me}
      BRUISER_DEV_HMAC_SECRET: ${BRUISER_DEV_HMAC_SECRET:-change-me}
      BRUISER_MERCHANT_ID: arsenal
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["demo"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["demo"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  bruiser-pg:
