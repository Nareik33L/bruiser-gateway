# Envoy ext_authz calling Bruiser POST /v1/authorize (Edge deployment method).
# Lab analogue: cmd/simtix SIMTIX_EDGE_ADDR. Paths are the unverified Arsenal-like
# routes in configs/arsenal.yaml.

static_resources:
  listeners:
    - name: box_office
      address: { socket_address: { address: 0.0.0.0, port_value: 8088 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://gateway:8080
                          cluster: bruiser
                          timeout: 2s
                        path_prefix: /v1/authorize
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: cookie
                              - exact: authorization
                          headers_to_add:
                            - key: X-Bruiser-Edge-Secret
                              value: edge-secret-dev
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-bruiser-execution
                              - exact: x-bruiser-fence
                              - exact: x-bruiser-customer
                              - exact: x-bruiser-origin-secret
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local
                  virtual_hosts:
                    - name: origin
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: simtix }
  clusters:
    - name: bruiser
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: bruiser
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: gateway, port_value: 8080 } }
    - name: simtix
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: simtix
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: simtix, port_value: 8090 } }
