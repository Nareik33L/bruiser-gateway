# Reference: NGINX auth_request as the Edge placement.
# Point this at your existing origin. Bruiser is not an API gateway.
# Option A: wrap only allocation locations (hold/purchase).
# Option B: wrap a wider prefix; unmatched routes in the profile pass through.
#
# Substitute BRUISER_EDGE_SECRET and BRUISER_ORIGIN_SECRET from the
# environment (envsubst) or a secrets include. The committed "change-me"
# placeholders fail production validation and must not be used live.

upstream bruiser { server gateway:8080; }
upstream origin { server simtix:8090; }

server {
    listen 80;

    location /api/ {
        auth_request /bruiser-auth;
        auth_request_set $bruiser_exe $upstream_http_x_bruiser_execution;
        auth_request_set $bruiser_fence $upstream_http_x_bruiser_fence;
        auth_request_set $bruiser_cust $upstream_http_x_bruiser_customer;
        # Origin lockdown secret is configured on this edge. /v1/authorize
        # never returns it.
        set $bruiser_origin_lock "change-me";

        proxy_pass http://origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Bruiser-Execution $bruiser_exe;
        proxy_set_header X-Bruiser-Fence $bruiser_fence;
        proxy_set_header X-Bruiser-Customer $bruiser_cust;
        proxy_set_header X-Bruiser-Origin-Secret $bruiser_origin_lock;
    }

    location = /bruiser-auth {
        internal;
        proxy_pass http://bruiser/v1/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Bruiser-Edge-Secret "change-me";
        proxy_set_header Cookie $http_cookie;
        # auth_request does not forward the body; for POST /api/orders set
        # X-Bruiser-Event-Id at the edge or use the Go Edge analogue.
    }
}
