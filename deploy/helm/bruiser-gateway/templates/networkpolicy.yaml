{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bruiser-gateway
spec:
  podSelector:
    matchLabels:
      app: bruiser-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
        - port: 8082
        - port: 8081
  egress:
    - ports:
        - port: 5432
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
{{- end }}
