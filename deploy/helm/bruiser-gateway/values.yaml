replicaCount: 1
image:
  repository: bruiser-gateway
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
  proxyPort: 8081
env:
  BRUISER_HTTP_ADDR: ":8080"
  BRUISER_PROXY_ADDR: ":8081"
  BRUISER_PROFILE: /configs/example.yaml
  BRUISER_TELEMETRY: "0"
  BRUISER_HEARTBEAT_INTERVAL: 20s
  BRUISER_LEASE_TTL: 60s
secrets:
  BRUISER_DATABASE_URL: postgres://bruiser:bruiser@postgres:5432/bruiser?sslmode=disable
  BRUISER_DEV_HMAC_SECRET: change-me
  BRUISER_EDGE_SECRET: change-me
  BRUISER_ORIGIN_SECRET: change-me
  BRUISER_ADMIN_SECRET: change-me
originURL: ""
resources: {}
