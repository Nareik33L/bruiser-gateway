[project]
name = "bruiser-sdk"
version = "0.1.0"
description = "Bruiser Embedded SDK for Python"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bruiser*"]
