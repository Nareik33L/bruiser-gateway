repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: bruiser-lab-secrets
        name: bruiser lab-secret allowlist
        language: script
        entry: scripts/check-secrets.sh
        pass_filenames: false
