name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Verify modules
        run: go mod download && go mod verify
      - name: Build (no further module network)
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/bruiser ./cmd/bruiser
          go build -trimpath -ldflags="-s -w" -o dist/simtix ./cmd/simtix
          sha256sum dist/bruiser dist/simtix > dist/SHA256SUMS
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Sign binaries
        run: |
          cosign sign-blob --yes --bundle dist/bruiser.cosign.bundle dist/bruiser
          cosign sign-blob --yes --bundle dist/simtix.cosign.bundle dist/simtix
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/bruiser
            dist/simtix
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bruiser-signed
          path: dist/
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/')
        id: image
        run: |
          img=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$img:${{ github.sha }}" -t "$img:${{ github.ref_name }}" .
          docker push "$img:${{ github.sha }}"
          docker push "$img:${{ github.ref_name }}"
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$img:${{ github.sha }}")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
          echo "image=${ref%@*}" >> "$GITHUB_OUTPUT"
      - name: Sign image
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bruiser
            dist/simtix
            dist/SHA256SUMS
            dist/bruiser.cosign.bundle
            dist/simtix.cosign.bundle
